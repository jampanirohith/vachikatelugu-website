name: Validate catalogue and trigger Vachika deployment

on:
  push:
    branches:
      - main
    paths:
      - "vachikatelugu.db"
      - ".github/workflows/notify-vachikatelugu-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vachikatelugu-pages-deploy
  cancel-in-progress: false

jobs:
  validate-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the private data repository
        uses: actions/checkout@v4

      - name: Validate SQLite integrity and normalized catalogue schema
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          path = Path("vachikatelugu.db")
          if not path.is_file():
              sys.exit("ERROR: vachikatelugu.db is missing from the repository root.")

          con = None
          try:
              con = sqlite3.connect(f"file:{path.resolve()}?mode=ro", uri=True)
              con.row_factory = sqlite3.Row

              result = con.execute("PRAGMA quick_check").fetchone()
              if not result or result[0] != "ok":
                  sys.exit(f"ERROR: SQLite quick_check failed: {tuple(result) if result else result}")

              fk_errors = con.execute("PRAGMA foreign_key_check").fetchall()
              if fk_errors:
                  preview = [tuple(row) for row in fk_errors[:20]]
                  sys.exit(f"ERROR: foreign-key violations ({len(fk_errors)}); first rows: {preview}")

              tables = {
                  r[0] for r in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              required_columns = {
                  "schema_metadata": {"key", "value"},
                  "movies": {"imdb_id", "title", "processing_status", "release_year"},
                  "albums": {"album_id", "movie_id", "title"},
                  "songs": {"song_id", "album_id", "movie_id", "title", "track_number",
                            "lrc_lyrics", "plain_lyrics"},
                  "artists": {"artist_id", "artist_name"},
                  "lyricists": {"lyricist_id", "lyricist_name"},
                  "song_artists": {"song_id", "artist_id", "credit_order", "credit_role"},
                  "song_lyricists": {"song_id", "lyricist_id", "credit_order"},
                  "song_genres": {"song_id", "genre", "genre_order"},
                  "song_media": {"song_id", "platform", "external_id", "url"},
                  "movie_links": {"movie_id", "link_type", "url"},
                  "movie_genres": {"movie_id", "genre", "genre_order"},
                  "movie_people": {"movie_id", "role", "person_name", "credit_order"},
                  "ott_availability": {"movie_id", "provider", "availability_type"},
                  "source_album_matches": {"movie_id", "platform", "album_id", "album_title"},
              }
              missing_tables = sorted(set(required_columns) - tables)
              if missing_tables:
                  sys.exit("ERROR: required table(s) missing: " + ", ".join(missing_tables))

              for table, expected in required_columns.items():
                  actual = {
                      row[1].lower() for row in con.execute(f'PRAGMA table_info("{table}")')
                  }
                  missing = sorted(expected - actual)
                  if missing:
                      sys.exit(
                          f"ERROR: normalized table {table} is missing column(s): "
                          + ", ".join(missing)
                      )

              version_row = con.execute(
                  "SELECT value FROM schema_metadata WHERE key='schema_version'"
              ).fetchone()
              schema_version = str(version_row[0]) if version_row else ""
              if schema_version != "5":
                  sys.exit(